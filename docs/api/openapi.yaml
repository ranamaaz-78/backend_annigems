      summary: Bootstrap
      operationId: bootstrap
      description: "Everything the app needs on start: brand, navigation, footer, contact, currencies (with rates), tax,\nfree-shipping threshold, shipping methods, countries, order stages, catalog filters, Stripe publishable key,\nGoogle client id, gold rate. The mobile variant also returns `app` (versions, force update, maintenance)."
