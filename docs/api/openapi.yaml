openapi: 3.0.3
info:
  title: 'AANI GEMAS API'
  description: 'Web storefront, mobile app and admin APIs for AANI GEMAS.'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: 'Web · Store'
    description: "\nPublic store data: bootstrap and home. Send `X-Currency` (EUR, USD, INR, AED, GBP) to get prices in that currency."
  -
    name: 'Web · Catalog'
    description: ''
  -
    name: 'Web · Design Your Ring'
    description: "\nFlow: choose ring → choose size → choose stone → preview → add to cart. Metal and karat come with the ring."
  -
    name: 'Web · Cart'
    description: "\nThe cart lives on the client. This endpoint prices it; it never trusts client prices."
  -
    name: 'Web · Content'
    description: ''
  -
    name: 'Web · Forms'
    description: ''
  -
    name: 'Web · Auth'
    description: "\nCustomer authentication. Successful calls return `{ data: { user, token, token_type, expires_at } }`.\nSend the token as `Authorization: Bearer <token>`."
  -
    name: 'Web · Account'
    description: ''
  -
    name: 'Web · Wishlist'
    description: "\nProduct ids may be numeric ids or storefront legacy ids (`r1`)."
  -
    name: 'Web · Checkout & orders'
    description: ''
  -
    name: 'Mobile · Store'
    description: "\nPublic store data: bootstrap and home. Send `X-Currency` (EUR, USD, INR, AED, GBP) to get prices in that currency."
  -
    name: 'Mobile · Catalog'
    description: ''
  -
    name: 'Mobile · Design Your Ring'
    description: "\nFlow: choose ring → choose size → choose stone → preview → add to cart. Metal and karat come with the ring."
  -
    name: 'Mobile · Cart'
    description: "\nThe cart lives on the client. This endpoint prices it; it never trusts client prices."
  -
    name: 'Mobile · Content'
    description: ''
  -
    name: 'Mobile · Forms'
    description: ''
  -
    name: 'Mobile · Auth'
    description: "\nCustomer authentication. Successful calls return `{ data: { user, token, token_type, expires_at } }`.\nSend the token as `Authorization: Bearer <token>`."
  -
    name: 'Mobile · Account'
    description: ''
  -
    name: 'Mobile · Wishlist'
    description: "\nProduct ids may be numeric ids or storefront legacy ids (`r1`)."
  -
    name: 'Mobile · Checkout & orders'
    description: ''
  -
    name: 'Mobile · Mobile devices'
    description: "\nPush tokens are stored only; sending comes in a later phase."
  -
    name: 'Admin · Catalog'
    description: "\nProducts. Prices are EUR minor units. `images` is the ordered gallery (first = main image)."
  -
    name: 'Admin · Design Your Ring'
    description: ''
  -
    name: 'Admin · Content'
    description: "\nContent blocks have a fixed set of keys (seeded from the storefront). The admin UI renders a structured form per key."
  -
    name: 'Admin · Auth'
    description: "\nStaff session authentication with mandatory TOTP 2FA."
  -
    name: 'Admin · Activity log'
    description: ''
  -
    name: 'Admin · App settings'
    description: "\nStore name/emails, mobile app versions, maintenance flag. Secrets (Stripe, Google, provider keys) live only in .env."
  -
    name: 'Admin · Coupons'
    description: ''
  -
    name: 'Admin · Customers'
    description: ''
  -
    name: 'Admin · Dashboard'
    description: ''
  -
    name: 'Admin · Media'
    description: ''
  -
    name: 'Admin · Messages'
    description: ''
  -
    name: 'Admin · Orders'
    description: ''
  -
    name: 'Admin · Pricing'
    description: ''
  -
    name: 'Admin · Staff & roles'
    description: ''
  -
    name: Webhooks
    description: "\nStripe webhook. Verifies the `Stripe-Signature` header with STRIPE_WEBHOOK_SECRET.\nIdempotent: every event id is processed once. Only this endpoint marks orders paid."
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'Get a customer token from <code>POST /auth/login</code>, <code>/auth/register</code> or <code>/auth/google</code> and send it as <code>Authorization: Bearer &lt;token&gt;</code>.'
security:
  -
    default: []
paths:
  /api/v1/web/bootstrap:
