  /api/v1/mobile/checkout:
    post:
      summary: Checkout
      operationId: checkout
      description: "Requires an `Idempotency-Key` header (e.g. a UUID per checkout attempt; repeating the same request\nwith the same key returns the same order). The server re-quotes the cart, validates stock, sizes and\ncombos, creates a `pending_payment` order with snapshots and a Stripe PaymentIntent in the order currency.\nWeb returns `payment: {client_secret, publishable_key}`; mobile also returns `customer_id` and\n`ephemeral_key` for PaymentSheet. Then confirm with Stripe and poll `GET /orders/{number}`."
      parameters:
        -
          in: header
          name: Idempotency-Key
          description: ''
          example: 6f1c2b8e-3d4a-4c6f-9a1b-2e3f4a5b6c7d
          schema:
            type: string
        -
          in: header
          name: X-Currency
          description: ''
          example: EUR
          schema:
            type: string
      responses: {  }
      tags:
        - 'Mobile · Checkout & orders'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  description: 'Cart lines (same shape as cart/quote).'
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: ''
                        example: product
                      product_id:
                        type: integer
                        description: ''
                        example: 7
                      qty:
                        type: integer
                        description: ''
                        example: 1
                    required:
                      - type
                      - qty
                address_id:
                  type: integer
                  description: 'Saved address id (or send `address`).'
                  example: 1
                address:
                  type: object
                  description: 'Inline address: label, name, phone, line1, city, state, zip, country_code.'
                  example: []
                  properties: {  }
                save_address:
                  type: boolean
                  description: 'Save the inline address to the account.'
                  example: false
                shipping_method:
                  type: string
                  description: ''
                  example: standard
                coupon_code:
                  type: string
                  description: ''
                  example: AANI10
                customer_note:
                  type: string
                  description: ''
                  example: 'Gift wrap please'
              required:
                - items
                - shipping_method
