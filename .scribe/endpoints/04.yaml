        content: '{"data":[{"category":"Orders & Shipping","items":[{"id":1,"q":"How long does delivery take?","a":"Ready-to-ship pieces arrive in 5\u20137 business days with Standard Delivery. Made-to-order pieces ship within 4\u20136 weeks."},{"id":2,"q":"Is shipping free?","a":"Standard shipping is free on orders over $500. Otherwise rates start at $25."},{"id":3,"q":"Can I track my order?","a":"Yes. Sign in and open My Account \u2192 My Orders to see the status and tracking details of every order."}]},{"category":"Returns & Care","items":[{"id":4,"q":"What is your return policy?","a":"30-day free returns on unworn, ready-to-ship pieces. Custom and engraved items are repaired or resized instead."},{"id":5,"q":"Do you offer resizing?","a":"Free resizing within 60 days of purchase on most rings. Beyond that, a small fee applies."},{"id":6,"q":"How do I care for my jewelry?","a":"Store it in the provided pouch, avoid harsh chemicals and clean gently with a soft cloth. We offer complimentary yearly cleaning."}]},{"category":"Gold & Gemstones","items":[{"id":7,"q":"What gold purity do you use?","a":"All our gold jewelry is 18K (75% pure gold), hallmarked and certified."},{"id":8,"q":"Are your diamonds certified?","a":"Yes. All diamonds and major gemstones are GIA certified and come with their certificate."},{"id":9,"q":"Why does the price change?","a":"Gold-based prices follow the live gold rate so you only ever pay a fair, transparent price."}]},{"category":"Custom Rings & Payment","items":[{"id":10,"q":"How does Design Your Ring work?","a":"Choose a setting, a stone and your size in four steps and see a live price. Our artisans then craft it to order."},{"id":11,"q":"Which payment methods do you accept?","a":"Visa, Mastercard and American Express via Stripe."},{"id":12,"q":"Is my payment secure?","a":"Yes. Payments are encrypted and processed by a PCI-compliant provider."}]}],"meta":{"currency":"EUR"}}'
