        content: '{"data":{"story":["AANI GEMAS began in 1987 as a small bench in Mumbai, where our founder shaped her first 18K gold ring by hand. Today the atelier is still guided by the same belief: jewelry should be personal, lasting and beautiful up close.","Every piece is designed in-house, set by master artisans and inspected under magnification before it leaves our workshop. We work with GIA certified stones and responsibly sourced gold, and we share the real gold rate so pricing is always transparent."],"stats":[{"value":38,"suffix":"+","label":"Years of craft"},{"value":12000,"suffix":"+","label":"Pieces handcrafted"},{"value":40,"suffix":"+","label":"Master artisans"},{"value":98,"suffix":"%","label":"Happy customers"}],"values":[{"icon":"\u2726","title":"Handcrafted","text":"Every ring, pendant and bracelet is shaped and finished by hand, never mass-produced."},{"icon":"\u25c8","title":"Certified & Ethical","text":"GIA certified gemstones and responsibly sourced 18K gold with full documentation."},{"icon":"\u2666","title":"Made to Last","text":"A lifetime craftsmanship warranty, free resizing and complimentary care for every piece."},{"icon":"\u2756","title":"Truly Personal","text":"Design your own ring and see transparent live pricing as you choose metal and stone."}],"milestones":[{"year":"1987","title":"The first bench","text":"A single workbench opens in Mumbai, crafting rings for family and friends."},{"year":"2001","title":"The atelier","text":"A full workshop with 15 artisans and an in-house gemology lab."},{"year":"2014","title":"Going global","text":"Insured worldwide shipping begins, bringing AANI GEMAS to customers in 30 countries."},{"year":"2024","title":"Design Your Ring","text":"Our bespoke configurator launches so anyone can design a ring online with live pricing."}]},"meta":{"currency":"EUR"}}'
